<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Foodie Treats Illustrations</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%A1%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700;6..12,800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="hero">
    <span class="hero-tag">🍡 15 Illustrations · New Set</span>
    <h1>Cute Foodie Treats</h1>
    <p class="sub">A set of 15 cute foodie treats illustrations — sweet, simple, and ready to use in whatever you’re
      creating.</p>
    <div class="maker"><span class="avatar">✓</span> Commercial license included</div>
  </div>

  <div class="wrap">
    <div class="gallery" id="gallery">
      <div class="g-item"><img src="assets/bingsu.webp" alt="Bingsu" loading="eager" decoding="async"></div>
      <div class="g-item"><img src="assets/butter-tteok.webp" alt="Butter Tteok" loading="lazy" decoding="async"></div>
      <div class="g-item"><img src="assets/cilembu-sweet-potato.webp" alt="Cilembu Sweet Potato" loading="lazy"
          decoding="async"></div>
      <div class="g-item"><img src="assets/dubai-chewy-cookie.webp" alt="Dubai Chewy Cookie" loading="lazy"
          decoding="async"></div>
      <div class="g-item"><img src="assets/dubai-style-chocolate-bar.webp" alt="Dubai Style Chocolate Bar"
          loading="lazy" decoding="async"></div>
      <div class="g-item"><img src="assets/matcha-mochi.webp" alt="Matcha Mochi" loading="lazy" decoding="async"></div>
      <div class="g-item"><img src="assets/matcha-strawberry-dessert.webp" alt="Matcha Strawberry Dessert"
          loading="lazy" decoding="async"></div>
      <div class="g-item"><img src="assets/pistachio-crinkle-cookie.webp" alt="Pistachio Crinkle Cookie" loading="lazy"
          decoding="async"></div>
      <div class="g-item"><img src="assets/pistachio-kunafa.webp" alt="Pistachio Kunafa" loading="lazy"
          decoding="async"></div>
      <div class="g-item"><img src="assets/salt-bread.webp" alt="Salt Bread" loading="lazy" decoding="async"></div>
      <div class="g-item"><img src="assets/strawberry-mochi-donut.webp" alt="Strawberry Mochi Donut" loading="lazy"
          decoding="async"></div>
      <div class="g-item"><img src="assets/tanghulu.webp" alt="Tanghulu" loading="lazy" decoding="async"></div>
      <div class="g-item"><img src="assets/tiramisu-sodok.webp" alt="Tiramisu Sodok" loading="lazy" decoding="async">
      </div>
      <div class="g-item"><img src="assets/ube-halaya.webp" alt="Ube Halaya" loading="lazy" decoding="async"></div>
      <div class="g-item"><img src="assets/ube-matcha-dessert.webp" alt="Ube Matcha Dessert" loading="lazy"
          decoding="async"></div>
    </div>
    <!-- <p class="gallery-foot">15 high-resolution, transparent PNGs — all included in the bundle</p> -->
  </div>

  <footer>
    <p>© 2026 Cute Foodie Treats. All rights reserved.</p>
  </footer>

</body>

</html>
